name: release

# Tag a commit `vX.Y.Z` (or run manually) to build both loaders and publish to Modrinth.
#
# Required repository settings:
#   secrets.MODRINTH_TOKEN — a Modrinth PAT with "create versions" scope
#   secrets.MODRINTH_ID    — the Modrinth project id (or slug)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Chatsounds ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            neoforge/build/libs/chatsounds-forge-*.jar
            fabric/build/libs/chatsounds-fabric-*.jar

      - name: Publish Forge to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: neoforge/build/libs/chatsounds-forge-*.jar
          name: Chatsounds ${{ steps.version.outputs.version }} (Forge)
          version: ${{ steps.version.outputs.version }}
          version-type: release
          loaders: forge
          game-versions: 1.20.1
          dependencies: |
            kotlin-for-forge(required)

      - name: Publish Fabric to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: fabric/build/libs/chatsounds-fabric-*.jar
          name: Chatsounds ${{ steps.version.outputs.version }} (Fabric)
          version: ${{ steps.version.outputs.version }}
          version-type: release
          loaders: fabric
          game-versions: 1.20.1
          dependencies: |
            fabric-api(required)
            fabric-language-kotlin(required)
